version: '3.8'

services:
  api:
    build:
      context: ./backend
      target: production
    container_name: shipyard_api
    ports:
      - "3001:3000"
    env_file:
      - ./backend/.env.development
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD:-rootpassword}
      DB_NAME: ${DB_NAME:-shipyard_db}
      OLLAMA_URL: http://ollama:11434
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
    restart: unless-stopped
  postgres:
    image: postgres:15-alpine
    container_name: shipyard_db
    environment:
      POSTGRES_USER: ${DB_USER:-root}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-rootpassword}
      POSTGRES_DB: ${DB_NAME:-shipyard_db}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-root} -d ${DB_NAME:-shipyard_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres_test:
    image: postgres:15-alpine
    container_name: shipyard_test_db
    environment:
      POSTGRES_USER: ${DB_USER:-root}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-rootpassword}
      POSTGRES_DB: shipyard_test_db
    ports:
      - "5434:5432"
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    container_name: shipyard_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: shipyard_mq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: shipyard_ai
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 3
    # NOT: GPU (Nvidia) ayarı opsiyonel yapıldı. Eğer deploy edilecek sunucuda
    # fiziksel bir GPU varsa aşağıdaki satırların (deploy bloğu) yorum satırını ( # ) kaldırabilirsin.
    # Aksi takdirde CPU sunucularında projenin çökmesine neden olur.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  ollama_data: