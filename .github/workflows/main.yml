name: Shipyard CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
env:
  NODE_ENV: test
  PORT: 3000
  DB_HOST: localhost
  DB_PORT: 5432
  DB_USER: test_user
  DB_PASSWORD: test_password
  DB_NAME: shipyard_test_db
  JWT_SECRET: ci_test_jwt_secret_key
  JWT_EXPIRATION: 15m
  JWT_REFRESH_SECRET: ci_test_refresh_secret_key
  JWT_REFRESH_EXPIRATION: 7d
  OLLAMA_URL: http://127.0.0.1:11434

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Kodu Klonla
        uses: actions/checkout@v5

      - name: ⚙️ Node.js Kurulumu
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: 📦 Bağımlılıkları Yükle (Dependencies)
        run: npm ci

      - name: 🏗️ Projeyi Derle (Build)
        run: npm run build

      - name: 🧪 Unit Testleri Çalıştır
        run: npm run test

      - name: 🚀 E2E Uçtan Uca Testleri Çalıştır
        run: npm run test:e2e