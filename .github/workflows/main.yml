name: Shipyard CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Kodu Klonla
        uses: actions/checkout@v4

      - name: ⚙️ Node.js Kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Bağımlılıkları Yükle (Dependencies)
        run: npm ci

      - name: 🏗️ Projeyi Derle (Build)
        run: npm run build

      - name: 🧪 Unit Testleri Çalıştır
        run: npm run test

      - name: 🚀 E2E Uçtan Uca Testleri Çalıştır
        run: npm run test:e2e