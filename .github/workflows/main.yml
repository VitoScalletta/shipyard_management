name: Shipyard CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
env:
  NODE_ENV: test
  PORT: 3000
  DB_HOST: localhost
  DB_PORT: 5432
  DB_USER: test_user
  DB_PASSWORD: test_password
  DB_NAME: shipyard_test_db
  JWT_SECRET: ci_test_jwt_secret_key
  JWT_EXPIRATION: 15m
  JWT_REFRESH_SECRET: ci_test_refresh_secret_key
  JWT_REFRESH_EXPIRATION: 7d
  OLLAMA_URL: http://127.0.0.1:11434

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: shipyard_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d shipyard_test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 📥 Kodu Klonla
        uses: actions/checkout@v5

      - name: ⚙️ Node.js Kurulumu
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: 📦 Bağımlılıkları Yükle (Dependencies)
        run: npm ci --prefix backend

      - name: 📦 Frontend Bağımlılıklarını Yükle
        run: npm ci --prefix frontend

      - name: 🏗️ Projeyi Derle (Build)
        run: npm --prefix backend run build

      - name: 🏗️ Frontend'i Derle
        run: npm --prefix frontend run build

      - name: 🧪 Unit Testleri Çalıştır
        run: npm --prefix backend run test

      - name: 🚀 E2E Uçtan Uca Testleri Çalıştır
        run: npm --prefix backend run test:e2e